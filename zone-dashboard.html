<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailOptAI | Indian Railways — Zone Jurisdiction & Access Control</title>
  <meta name="description" content="Indian Railways Zonal Jurisdiction and Access Control Dashboard. Enforcing single-zone role boundaries and Pan-India security controls.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284C7'><path d='M4 15.5C4 14.1 5.1 13 6.5 13h11c1.4 0 2.5 1.1 2.5 2.5V19c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2v-3.5z'/><path d='M4 11V6c0-1.7 1.3-3 3-3h10c1.7 0 3 1.3 3 3v5'/><circle cx='8.5' cy='16.5' r='1.5'/><circle cx='15.5' cy='16.5' r='1.5'/></svg>">
</head>
<body class="zone-dashboard-body">

  <!-- Header -->
  <header class="zone-dash-header">
    <div class="zone-dash-logo">
      <div class="zone-dash-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="16" rx="2"></rect>
          <path d="M4 11h16"></path>
          <path d="M12 3v8"></path>
          <path d="m8 19-2 3"></path>
          <path d="m16 19 2 3"></path>
        </svg>
      </div>
      <div>
        <h1 style="margin: 0; font-size: 19px;">RailOpt<span>AI</span> — Inter-Zonal Operations</h1>
        <div style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Indian Railways 18 Zones Network & Operations</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="index.html" style="font-size: 13px; color: var(--ir-blue); font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Back to Dashboard
      </a>
      <button id="zoneDashLogoutBtn" style="background: none; border: 1px solid var(--border-light); padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--signal-red); cursor: pointer; font-family: var(--font-sans);">Logout</button>
    </div>
  </header>

  <!-- Content -->
  <div class="zone-dash-content">

    <div class="zone-dash-title">
      <h2>Indian Railways — 18 Zonal Railway Operational Networks</h2>
      <p>Operational jurisdiction, route corridors, and infrastructure telemetry across all 18 Indian Railway zonal systems.</p>
    </div>

    <!-- Operational Clearance Banner -->
    <div id="jurisdictionBanner" style="border-radius: 12px; padding: 18px 24px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; transition: all 0.3s ease;">
      <!-- Populated dynamically via JS -->
    </div>

    <!-- Zone Cards Grid -->
    <div class="zone-cards-grid" id="zoneCardsContainer">
      <!-- Rendered dynamically -->
    </div>

  </div>

  <script src="js/zones-data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Auth guard
      if (!AUTH.requireAuth()) return;

      const session = AUTH.getSession();
      const isPanIndia = AUTH.isPanIndia();
      const homeZoneCode = session.authorizedZone || session.zone || "NR";
      const homeZoneObj = ZONES_DATA.zones.find(z => z.code === homeZoneCode);
      const homeZoneName = homeZoneObj ? homeZoneObj.name : (session.authorizedZoneName || session.zoneName);

      // Populate Jurisdiction Clearance Banner
      const banner = document.getElementById("jurisdictionBanner");
      if (banner) {
        if (isPanIndia) {
          banner.style.background = "#F0FDF4";
          banner.style.border = "1px solid #BBF7D0";
          banner.innerHTML = `
            <div style="display: flex; align-items: center; gap: 16px;">
              <div style="width: 44px; height: 44px; border-radius: 10px; background: #DCFCE7; color: #16A34A; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                🌐
              </div>
              <div>
                <div style="font-size: 15px; font-weight: 800; color: #14532D; display: flex; align-items: center; gap: 8px;">
                  <span>Railway Board Apex Pan-India Clearance</span>
                  <span style="background: #16A34A; color: white; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 700;">PAN-INDIA CLEARANCE</span>
                </div>
                <div style="font-size: 12.5px; color: #166534; margin-top: 2px;">
                  Official: <strong>${session.name}</strong> (${session.roleTitle}) • ID: <code>${session.empId}</code>. Full operational authority to switch and inspect all 18 Indian Railway zonal networks.
                </div>
              </div>
            </div>
            <div style="text-align: right; font-size: 12px; color: #15803D; font-weight: 700; white-space: nowrap;">
              Active Zone: <span style="background: #0284C7; color: white; padding: 3px 8px; border-radius: 6px;">${session.zone || 'NR'}</span>
            </div>
          `;
        } else {
          banner.style.background = "#FEF3C7";
          banner.style.border = "1px solid #FCD34D";
          banner.innerHTML = `
            <div style="display: flex; align-items: center; gap: 16px;">
              <div style="width: 44px; height: 44px; border-radius: 10px; background: #FDE68A; color: #B45309; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                🔒
              </div>
              <div>
                <div style="font-size: 15px; font-weight: 800; color: #92400E; display: flex; align-items: center; gap: 8px;">
                  <span>Jurisdictional Boundary: Strictly ${homeZoneName} (${homeZoneCode})</span>
                  <span style="background: #D97706; color: white; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 700;">LOCKED TO REGION</span>
                </div>
                <div style="font-size: 12.5px; color: #78350F; margin-top: 2px;">
                  Official: <strong>${session.name}</strong> (${session.roleTitle}) • ID: <code>${session.empId}</code>. Regional officials only have access to their assigned operational zone. Inter-zonal switching is locked to prevent unauthorized cross-region data access.
                </div>
              </div>
            </div>
            <div style="text-align: right; font-size: 12px; color: #92400E; font-weight: 700; white-space: nowrap;">
              Assigned Base: <span style="background: #0284C7; color: white; padding: 3px 8px; border-radius: 6px;">${homeZoneCode}</span>
            </div>
          `;
        }
      }

      // Render zone cards
      const container = document.getElementById("zoneCardsContainer");
      if (!container) return;

      ZONES_DATA.zones.forEach(zone => {
        const isCurrentZone = zone.code === session.zone;
        const isAuthorized = isPanIndia || zone.code === homeZoneCode;

        const card = document.createElement("div");
        card.className = `zone-card ${isAuthorized ? 'authorized' : 'locked'}`;
        
        if (!isAuthorized) {
          card.style.cssText = "opacity: 0.52; cursor: not-allowed; border: 1px dashed #CBD5E1; background: #F8FAFC; filter: grayscale(0.2);";
        } else if (isCurrentZone) {
          card.style.cssText = `border-color: ${zone.color}; box-shadow: 0 4px 12px ${zone.color}25; cursor: pointer;`;
        } else {
          card.style.cssText = "cursor: pointer;";
        }

        let badgeHtml = "";
        let actionBtnHtml = "";

        if (isCurrentZone) {
          badgeHtml = '<span class="zone-card-auth-pill">● Active Base</span>';
          actionBtnHtml = `<div style="margin-top: 12px; font-size: 11.5px; color: ${zone.color}; font-weight: 700;">● Active Operational Base →</div>`;
        } else if (isAuthorized) {
          badgeHtml = '<span class="zone-card-auth-pill" style="background: rgba(2,132,199,0.1); color: var(--ir-blue);">Pan-India Access</span>';
          actionBtnHtml = `<div style="margin-top: 12px; font-size: 11.5px; color: var(--ir-blue); font-weight: 600;">Switch to ${zone.code} Operations →</div>`;
        } else {
          badgeHtml = '<span class="zone-card-auth-pill" style="background: rgba(239,68,68,0.1); color: #DC2626; border: 1px solid rgba(239,68,68,0.25);">🔒 Unauthorized Region</span>';
          actionBtnHtml = `<div style="margin-top: 12px; font-size: 11.5px; color: #94A3B8; font-weight: 600;">🔒 Switch Locked (${homeZoneCode} Only)</div>`;
        }

        card.innerHTML = `
          <div style="position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: ${isAuthorized ? zone.color : '#CBD5E1'}; border-radius: 4px 0 0 4px;"></div>
          <div class="zone-card-header">
            <span class="zone-card-code" style="background: ${isAuthorized ? zone.color : '#94A3B8'};">${zone.code}</span>
            <div>${badgeHtml}</div>
          </div>
          <div class="zone-card-name" style="${!isAuthorized ? 'color: #64748B;' : ''}">${zone.name}</div>
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">HQ: ${zone.hq}</div>
          <div class="zone-card-stats">
            <div class="zone-stat-item">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15l4-8 4 4 4-4 4 8"></path></svg>
              <strong>${zone.trackKm.toLocaleString()}</strong> km
            </div>
            <div class="zone-stat-item">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="16" rx="2"></rect><path d="M4 11h16"></path></svg>
              <strong>${zone.trainCount}</strong> trains
            </div>
            <div class="zone-stat-item">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83"></path></svg>
              <strong>${zone.stationCount}</strong> stations
            </div>
          </div>
          ${actionBtnHtml}
        `;

        card.addEventListener("click", () => {
          if (!isAuthorized) {
            alert(`⛔ Access Denied: Jurisdictional Boundary Locked\n\nOfficial: ${session.name} (${session.roleTitle})\nEmployee ID: ${session.empId}\nAssigned Region: ${homeZoneName} (${homeZoneCode})\n\nYou are not authorized to view or switch to ${zone.name} (${zone.code}). Under Indian Railways operations policy, regional officers are strictly restricted to their assigned railway zone.\n\nOnly Railway Board Apex Officials (e.g., RB-NDLS-CRB-0001) have Pan-India cross-zonal clearance.`);
            return;
          }

          const res = AUTH.switchZone(zone.code);
          if (res && !res.success) {
            alert(res.reason || "Unable to switch zone.");
            return;
          }
          window.location.href = "index.html";
        });

        container.appendChild(card);
      });

      // Logout
      const logoutBtn = document.getElementById("zoneDashLogoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => AUTH.logout());
      }
    });
  </script>
</body>
</html>
